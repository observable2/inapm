  <script id="7" type="text/html">
    <style>
      /* "new pattern": the citation anchor itself carries the hang indent,
         so its wrapping <p> is excluded above via :not(:has(...)).
         Zero out the wrapping <p>'s own margin so spacing below is
         controlled entirely and predictably by the rules below. */
      p:has(> a.hang) {
        margin: 0;
      }

      .hang {
        display: block;
        text-indent: -2em;
        margin-left: 2em;
      }

      /* tighten the gap between a .hang citation and an immediately
         following note blockquote, without affecting any other blockquote.
         The inner <p>'s own top margin is zeroed too, since it would
         otherwise collapse through the (border/padding-less) blockquote. */
      p:has(> a.hang) + blockquote {
        margin-top: 0.25em;
      }
      p:has(> a.hang) + blockquote > p:first-child {
        margin-top: 0;
      }

      small {
        font-size: 0.8em;
        line-height: 1.2;
      }

      /* When a note blockquote's paragraph consists entirely of a single
         <small> element, apply the reduced size *and* the tight line-height
         to the paragraph itself rather than to the inline <small>. Setting
         line-height on an inline element doesn't reliably shrink the line
         box (browsers still size the line using the block container's own,
         larger, inherited line-height), so it must be set on the block
         ancestor that actually establishes the line box. The inner <small>
         is then reset to 1em/1em so it doesn't compound the sizing. */
      blockquote p:has(> small:only-child) {
        font-size: 0.8em;
        line-height: 1.2;
      }
      blockquote p:has(> small:only-child) > small {
        font-size: 1em;
        line-height: inherit;
      }
    </style>
  </script>
